name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  RUST_BACKTRACE: 1
  CI: true

jobs:
  malware-indicators:
    name: Security / Malware indicators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate detector fixtures
        shell: pwsh
        run: ./scripts/check-malware-indicators.ps1 -SelfTest
      - name: Scan tracked files without installing dependencies
        shell: pwsh
        run: ./scripts/check-malware-indicators.ps1

  audit:
    name: Security / npm audit
    needs: malware-indicators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.3
      - run: npm ci --include=optional --no-audit --no-fund
      - run: npm run audit:ci

  secret-scan:
    name: Security / Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/secret-scanning-preflight.sh --self-test
      - run: ./scripts/secret-scanning-preflight.sh

  migration-smoke:
    name: Database / migration smoke (PostgreSQL 16)
    needs: [audit, secret-scan]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: xconfess_migration_smoke
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xconfess_migration_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      APP_ENV: ci
      DB_HOST: localhost
      DB_PORT: 5432
      DB_READ_HOST: localhost
      DB_READ_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: unused
      DB_NAME: xconfess_migration_smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.3
      - run: npm ci --include=optional --no-audit --no-fund
      - run: npm run backend:migration:smoke

  apps:
    name: Apps / lint, typecheck, build
    needs: [audit, secret-scan]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: xconfess
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xconfess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      APP_ENV: ci
      PORT: 5000
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:5000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: xconfess
      TYPEORM_SYNCHRONIZE: true
      TYPEORM_MIGRATIONS_RUN: false
      JWT_SECRET: ci-jwt-secret-with-more-than-32-characters
      APP_SECRET: ci-app-secret-with-more-than-32-characters
      # Synthetic test-only keys; production validation remains enabled.
      CONFESSION_ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
      ENCRYPTION_MASTER_KEY_v1: '2222222222222222222222222222222222222222222222222222222222222222'
      ENABLE_BACKGROUND_JOBS: false
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      STELLAR_FEATURES_ENABLED: false
      BACKEND_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_WS_URL: ws://localhost:5000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_STELLAR_CONTRACT_ID: CBFR2MDZBQPTNBIJCT32MTDDQLW2AQNDWNO777F3QT6ANYKTHETQZWD3
      NEXT_PUBLIC_DEV_BYPASS_AUTH: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.3
      - run: npm ci --include=optional --no-audit --no-fund
      - name: Wait for PostgreSQL and Redis health
        run: npm run services:wait
        env:
          SERVICE_WAIT_TIMEOUT_MS: 60000
      - name: Verify Redis outages, feed properties, message races and notification failures
        run: npm run test:reliability --workspace=xconfess-backend
      - run: npm run backend:test:critical-coverage
      - run: npm run frontend:env:test
      - name: Start backend for API contract drift check
        shell: bash
        run: |
          npm run backend:build
          npm run start:backend > backend-api-contract.log 2>&1 &
          echo $! > backend-api-contract.pid
      - name: Validate frontend proxies against backend OpenAPI
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/api/health/live >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat backend-api-contract.log
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:5000/api/docs-json > openapi.json
          npm run api:contract-drift -- --spec="$PWD/openapi.json"
      - run: npx playwright install --with-deps chromium
      - run: npm run frontend:test:a11y
      - run: npm run ci:apps

  contracts:
    name: Contracts
    needs: [audit, secret-scan]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xconfess-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.86.0
          components: rustfmt, clippy
          targets: wasm32v1-none
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: xconfess-contracts
          cache-targets: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Check contract ABI drift
        run: |
          python3 scripts/test_extract_contract_functions.py
          bash scripts/check-abi-drift.sh
      - name: Check contract upgrade compatibility checklist
        working-directory: ${{ github.workspace }}
        run: npm run contracts:compatibility
      - name: Test contract quality gates
        working-directory: ${{ github.workspace }}
        run: npm run contracts:quality-tests
      - name: Rebuild WASM and verify release manifest
        working-directory: .
        run: bash scripts/contracts-release.sh check
      - name: Test release manifest validation failures
        working-directory: .
        run: bash scripts/test-contract-release-metadata.sh
